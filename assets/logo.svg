<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00aa"/>
      <stop offset="50%" stop-color="#9d00ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" rx="40" fill="url(#bg)"/>
  <!-- Thin neon frame -->
  <rect x="24" y="24" width="752" height="752" rx="32" fill="none" stroke="url(#neon)" stroke-width="3" opacity="0.8"/>
  <!-- KALISO -->
  <text x="400" y="360" text-anchor="middle" font-family="monospace" font-size="110" font-weight="900" fill="url(#neon)" letter-spacing="12" filter="url(#glow)">KALISO</text>
  <!-- LINUXO -->
  <text x="400" y="450" text-anchor="middle" font-family="monospace" font-size="36" font-weight="700" fill="#e8e8e8" letter-spacing="18" opacity="0.95">LINUXO</text>
  <!-- subline -->
  <text x="400" y="495" text-anchor="middle" font-family="monospace" font-size="13" fill="#9d00ff" letter-spacing="4" opacity="0.75">ciberseguridad &amp; hacking &amp; vive coding</text>
  <!-- divider -->
  <line x1="280" y1="520" x2="520" y2="520" stroke="url(#neon)" stroke-width="1.5" opacity="0.5"/>
  <text x="400" y="545" text-anchor="middle" font-family="monospace" font-size="11" fill="#7a7a8a" letter-spacing="3">THM · HTB · GitHub</text>
</svg>
