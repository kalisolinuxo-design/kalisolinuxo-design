<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00aa"/>
      <stop offset="50%" stop-color="#9d00ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" rx="40" fill="url(#bg)"/>
  <!-- Outer neon ring -->
  <circle cx="400" cy="320" r="190" fill="none" stroke="url(#neon)" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
  <circle cx="400" cy="320" r="175" fill="#0f0a1a" stroke="#ff00aa" stroke-width="2" opacity="0.6"/>
  <!-- Dragon silhouette simplified -->
  <path d="M 280 340 C 300 260 380 220 440 250 C 480 270 500 300 490 340 C 520 310 530 280 515 250 C 490 270 460 280 440 250 C 400 210 320 240 295 310 C 270 330 250 360 280 340 Z
           M 320 300 C 340 285 365 280 385 295 C 375 310 350 315 330 305 Z
           M 450 310 C 465 305 475 310 480 325 C 470 335 455 330 450 315 Z
           M 380 340 L 400 380 L 420 340 L 405 360 L 395 360 Z" 
        fill="url(#neon)" opacity="0.95"/>
  <!-- Claws -->
  <path d="M 350 390 L 345 420 L 355 405 L 365 425 L 370 395 Z M 430 390 L 425 420 L 435 405 L 445 425 L 450 395 Z" fill="#ff00aa" opacity="0.8"/>
  <!-- Text KALISO -->
  <text x="400" y="570" text-anchor="middle" font-family="monospace" font-size="82" font-weight="900" fill="url(#neon)" letter-spacing="8" filter="url(#glow)">KALISO</text>
  <text x="400" y="620" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#e0e0e0" letter-spacing="14" opacity="0.9">LINUXO</text>
  <text x="400" y="650" text-anchor="middle" font-family="monospace" font-size="13" fill="#9d00ff" letter-spacing="3" opacity="0.7">ciberseguridad &amp; hacking &amp; vive coding</text>
</svg>
